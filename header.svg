<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mashiat Nabila — Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2a3a" stroke-width="0.6"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- ambient data specks -->
  <g fill="#22d3ee" opacity="0.22">
    <circle cx="120" cy="52" r="1.6"/>
    <circle cx="322" cy="34" r="1.2"/>
    <circle cx="618" cy="46" r="1.5"/>
    <circle cx="905" cy="30" r="1.3"/>
    <circle cx="1082" cy="58" r="1.6"/>
    <circle cx="215" cy="292" r="1.4"/>
    <circle cx="712" cy="300" r="1.2"/>
    <circle cx="988" cy="286" r="1.5"/>
  </g>

  <!-- ================= NAME BLOCK ================= -->
  <text x="70" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="2.5">
    MASHIAT NABILA
  </text>

  <rect x="72" y="122" width="86" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="70" y="156" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="18" font-weight="600" fill="#7dd3fc" letter-spacing="3.4">
    DATA ENGINEER
  </text>

  <text x="70" y="184" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14.5" fill="#8b9cb3" letter-spacing="0.4">
    Pipelines, data models, and the analytics built on top of them
  </text>

  <!-- monospace stack line -->
  <text x="70" y="212" font-family="'SF Mono',Consolas,'Courier New',monospace"
        font-size="12.5" fill="#4b6180" letter-spacing="0.8">
    python · sql · airflow · scikit-learn · power bi · fastapi
  </text>

  <!-- ================= PIPELINE ================= -->
  <g transform="translate(70, 256)">
    <!-- rail -->
    <line x1="8" y1="0" x2="1060" y2="0" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- flowing packets -->
    <g fill="#4ade80" filter="url(#glow)">
      <circle r="3.6" cy="0">
        <animate attributeName="cx" values="8;1060" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" cy="0">
        <animate attributeName="cx" values="8;1060" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" cy="0">
        <animate attributeName="cx" values="8;1060" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- stage nodes -->
    <g font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="11.5" fill="#8b9cb3" letter-spacing="1.1">
      <g>
        <circle cx="8" cy="0" r="7" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="8" cy="0" r="2.6" fill="#38bdf8"/>
        <text x="8" y="28" text-anchor="start">SOURCES</text>
      </g>
      <g>
        <circle cx="272" cy="0" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="272" cy="0" r="2.6" fill="#22d3ee"/>
        <text x="272" y="28" text-anchor="middle">INGEST + VALIDATE</text>
      </g>
      <g>
        <circle cx="536" cy="0" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="536" cy="0" r="2.6" fill="#22d3ee"/>
        <text x="536" y="28" text-anchor="middle">TRANSFORM + MODEL</text>
      </g>
      <g>
        <circle cx="800" cy="0" r="7" fill="#0d1117" stroke="#4ade80" stroke-width="2"/>
        <circle cx="800" cy="0" r="2.6" fill="#4ade80"/>
        <text x="800" y="28" text-anchor="middle">CURATED TABLES</text>
      </g>
      <g>
        <circle cx="1060" cy="0" r="7" fill="#0d1117" stroke="#4ade80" stroke-width="2"/>
        <circle cx="1060" cy="0" r="2.6" fill="#4ade80"/>
        <text x="1060" y="28" text-anchor="end">BI / ML</text>
      </g>
    </g>
  </g>
</svg>
