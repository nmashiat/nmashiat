<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mashiat Nabila — Building Data Platforms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111c2e"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2839" stroke-width="0.55"/>
    </pattern>

    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.5"/>

  <!-- ambient specks -->
  <g fill="#22d3ee" opacity="0.2">
    <circle cx="145" cy="48" r="1.6"/><circle cx="358" cy="34" r="1.2"/>
    <circle cx="1058" cy="54" r="1.5"/><circle cx="880" cy="30" r="1.3"/>
    <circle cx="232" cy="352" r="1.4"/><circle cx="960" cy="348" r="1.4"/>
  </g>

  <!-- ============ CENTERED TITLE BLOCK ============ -->
  <text x="600" y="88" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="50" font-weight="700" fill="#f0f6fc" letter-spacing="4">MASHIAT NABILA</text>

  <rect x="530" y="106" width="140" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="600" y="142" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="17" font-weight="600" fill="#7dd3fc" letter-spacing="4.5">BUILDING DATA PLATFORMS</text>

  <text x="600" y="172" text-anchor="middle" font-family="'SF Mono',Consolas,'Courier New',monospace"
        font-size="12.5" fill="#4b6180" letter-spacing="1.6">python · sql · airflow · power bi · fastapi</text>

  <!-- ============ PIPELINE ============ -->
  <g transform="translate(0,268)">
    <line x1="130" y1="0" x2="1070" y2="0" stroke="url(#rail)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- flowing packets -->
    <g filter="url(#glow)">
      <circle r="4" cy="0" fill="#67e8f9">
        <animate attributeName="cx" values="130;1070" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" cy="0" fill="#818cf8">
        <animate attributeName="cx" values="130;1070" dur="5s" begin="1.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="1.66s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" cy="0" fill="#c084fc">
        <animate attributeName="cx" values="130;1070" dur="5s" begin="3.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="3.33s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- STAGE 1 : SOURCES -->
    <g transform="translate(130,0)">
      <g transform="translate(-13,-62)" stroke="#38bdf8" stroke-width="1.9" fill="none">
        <ellipse cx="13" cy="5" rx="13" ry="4.6"/>
        <path d="M 0,5 V 24 A 13,4.6 0 0 0 26,24 V 5"/>
        <path d="M 0,14.5 A 13,4.6 0 0 0 26,14.5" opacity="0.55"/>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="#0d1117" stroke="#38bdf8" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="2.8" fill="#38bdf8"/>
      <text x="0" y="30" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
            font-size="10.5" fill="#8b9cb3" letter-spacing="1.4">SOURCES</text>
    </g>

    <!-- STAGE 2 : INGEST -->
    <g transform="translate(365,0)">
      <g transform="translate(-15,-60)" stroke="#22d3ee" stroke-width="1.9" fill="none">
        <path d="M 7,20 A 7.5,7.5 0 0 1 8,5 A 9.5,9.5 0 0 1 25,8 A 6.5,6.5 0 0 1 24,20 Z"/>
        <path d="M 15.5,10 V 18 M 11.5,14 L 15.5,18 L 19.5,14" opacity="0.8"/>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="#0d1117" stroke="#22d3ee" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="2.8" fill="#22d3ee"/>
      <text x="0" y="30" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
            font-size="10.5" fill="#8b9cb3" letter-spacing="1.4">INGEST + VALIDATE</text>
    </g>

    <!-- STAGE 3 : TRANSFORM -->
    <g transform="translate(600,0)">
      <g transform="translate(-16,-62)" stroke="#60a5fa" stroke-width="1.8" fill="none">
        <circle cx="12" cy="12" r="6.5"/>
        <path d="M 12,1.5 V 5 M 12,19 V 22.5 M 1.5,12 H 5 M 19,12 H 22.5
                 M 4.5,4.5 L 7,7 M 17,17 L 19.5,19.5 M 19.5,4.5 L 17,7 M 7,17 L 4.5,19.5"/>
        <circle cx="25" cy="21" r="4.5" opacity="0.75"/>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="#0d1117" stroke="#60a5fa" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="2.8" fill="#60a5fa"/>
      <text x="0" y="30" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
            font-size="10.5" fill="#8b9cb3" letter-spacing="1.4">TRANSFORM + MODEL</text>
    </g>

    <!-- STAGE 4 : ML -->
    <g transform="translate(835,0)">
      <g transform="translate(-16,-62)" stroke="#a78bfa" stroke-width="1.7" fill="none">
        <line x1="6" y1="6" x2="17" y2="12"/><line x1="6" y1="18" x2="17" y2="12"/>
        <line x1="17" y1="12" x2="27" y2="6"/><line x1="17" y1="12" x2="27" y2="18"/>
        <circle cx="6" cy="6" r="3" fill="#0d1117"/><circle cx="6" cy="18" r="3" fill="#0d1117"/>
        <circle cx="17" cy="12" r="3.4" fill="#0d1117"/>
        <circle cx="27" cy="6" r="3" fill="#0d1117"/><circle cx="27" cy="18" r="3" fill="#0d1117"/>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="#0d1117" stroke="#a78bfa" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="2.8" fill="#a78bfa"/>
      <text x="0" y="30" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
            font-size="10.5" fill="#8b9cb3" letter-spacing="1.4">ML + AI</text>
    </g>

    <!-- STAGE 5 : SERVE -->
    <g transform="translate(1070,0)">
      <g transform="translate(-16,-62)" stroke="#c084fc" stroke-width="1.9" fill="none">
        <rect x="1" y="2" width="30" height="22" rx="3.5" opacity="0.85"/>
        <path d="M 7,18 V 11 M 13,18 V 7 M 19,18 V 14 M 25,18 V 9" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="#0d1117" stroke="#c084fc" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="2.8" fill="#c084fc"/>
      <text x="0" y="30" text-anchor="middle" font-family="'SF Mono',Consolas,monospace"
            font-size="10.5" fill="#8b9cb3" letter-spacing="1.4">SERVE</text>
    </g>
  </g>

  <line x1="130" y1="344" x2="1070" y2="344" stroke="#1a2839" stroke-width="1"/>
</svg>
